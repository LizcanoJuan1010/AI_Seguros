version: '3'

vars:
  FRONTEND_DIR: apps/frontend
  BACKEND_DIR: apps/backend
  AI_DIR: apps/ai
  # 3001 en el host: el proxy de Vite (VITE_BACKEND_URL) ya asume 3001
  # (3000 suele estar ocupado en las máquinas de desarrollo).
  API_PORT: '{{default "3001" .PORT}}'
  WEB_PORT: '{{default "5173" .VITE_PORT}}'
  AI_PORT: '{{default "8085" .SEGURIA_AI_PORT}}'

tasks:
  default:
    desc: Lista las tareas disponibles
    cmds:
      - task --list

  dev:
    desc: Inicia frontend, backend e IA en modo desarrollo
    cmds:
      - task: doctor
      - task: dev:services

  dev:services:
    internal: true
    cmds:
      # Task usa /bin/sh (dash) por defecto; dash rechaza `trap ... INT`.
      # Forzamos bash + PIDs explícitos (jobs no funciona bien sin job control).
      - |
        bash -euo pipefail <<'SCRIPT'
        cleanup() {
          echo ""
          echo "Deteniendo servicios..."
          kill "${FRONTEND_PID:-}" "${BACKEND_PID:-}" "${AI_PID:-}" 2>/dev/null || true
          wait 2>/dev/null || true
        }
        trap cleanup EXIT

        echo "Frontend → http://localhost:{{.WEB_PORT}}"
        echo "Backend  → http://localhost:{{.API_PORT}}"
        echo "IA       → http://localhost:{{.AI_PORT}}"

        npm --prefix {{.FRONTEND_DIR}} run dev -- --host 0.0.0.0 --port {{.WEB_PORT}} --strictPort &
        FRONTEND_PID=$!

        PORT={{.API_PORT}} npm --prefix {{.BACKEND_DIR}} run start:dev &
        BACKEND_PID=$!

        (
          cd {{.AI_DIR}}
          if [ ! -x .venv/bin/uvicorn ]; then
            echo "Error: falta el venv de la API IA. Ejecuta: task setup"
            exit 1
          fi
          exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{.AI_PORT}} --reload
        ) &
        AI_PID=$!

        while true; do
          for pid in "$FRONTEND_PID" "$BACKEND_PID" "$AI_PID"; do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              exit 1
            fi
          done
          sleep 1
        done
        SCRIPT

  dev:frontend:
    desc: Solo el frontend (Vite)
    cmds:
      - npm --prefix {{.FRONTEND_DIR}} run dev -- --host 0.0.0.0 --port {{.WEB_PORT}} --strictPort

  dev:backend:
    desc: Solo el backend (NestJS)
    env:
      PORT: '{{.API_PORT}}'
    cmds:
      - npm --prefix {{.BACKEND_DIR}} run start:dev

  dev:ai:
    desc: Solo la API IA (FastAPI)
    cmds:
      - |
        cd {{.AI_DIR}}
        if [ ! -x .venv/bin/uvicorn ]; then
          echo "Error: falta el venv de la API IA. Ejecuta: task setup"
          exit 1
        fi
        .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{.AI_PORT}} --reload

  doctor:
    desc: Comprueba herramientas, entorno, dependencias y puertos
    cmds:
      - |
        command -v node >/dev/null 2>&1 || {
          echo "Error: Node.js no está instalado o no está en PATH."
          exit 1
        }
        command -v npm >/dev/null 2>&1 || {
          echo "Error: npm no está instalado o no está en PATH."
          exit 1
        }
        node -e '
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 20 || (major === 20 && minor < 19)) {
            console.error("Error: se requiere Node.js 20.19 o superior.");
            process.exit(1);
          }
          console.log(`Node.js ${process.versions.node} y npm disponibles.`);
        '
      - |
        command -v python3 >/dev/null 2>&1 || {
          echo "Error: Python 3 no está instalado o no está en PATH."
          exit 1
        }
        if command -v uv >/dev/null 2>&1; then
          echo "Python 3 y uv disponibles."
        else
          echo "Python 3 disponible. Aviso: uv no está en PATH (recomendado para apps/ai)."
        fi
      - task: env:check
      - |
        npm --prefix {{.FRONTEND_DIR}} ls --depth=0 >/dev/null 2>&1 || {
          echo "Error: faltan dependencias del frontend. Ejecuta: task setup"
          exit 1
        }
        npm --prefix {{.BACKEND_DIR}} ls --depth=0 >/dev/null 2>&1 || {
          echo "Error: faltan dependencias del backend. Ejecuta: task setup"
          exit 1
        }
        test -x {{.AI_DIR}}/.venv/bin/python || {
          echo "Error: falta el venv de apps/ai. Ejecuta: task setup"
          exit 1
        }
        echo "Dependencias de frontend, backend e IA instaladas."
      - |
        API_PORT={{.API_PORT}} WEB_PORT={{.WEB_PORT}} AI_PORT={{.AI_PORT}} node -e '
          const net = require("node:net");
          const ports = [
            Number(process.env.API_PORT),
            Number(process.env.WEB_PORT),
            Number(process.env.AI_PORT),
          ];
          const check = (port) => new Promise((resolve, reject) => {
            const server = net.createServer();
            server.unref();
            server.once("error", () => reject(new Error(`el puerto ${port} está ocupado`)));
            server.listen(port, "0.0.0.0", () => server.close(resolve));
          });
          Promise.all(ports.map(check))
            .then(() => console.log(`Puertos ${ports.join(", ")} disponibles.`))
            .catch((error) => {
              console.error(`Error: ${error.message}.`);
              process.exit(1);
            });
        '
      - echo "Diagnóstico completado correctamente."

  env:check:
    internal: true
    cmds:
      - |
        test -f {{.BACKEND_DIR}}/.env || {
          echo "Error: no existe {{.BACKEND_DIR}}/.env. Cópialo desde {{.BACKEND_DIR}}/.env.example y configura DATABASE_URL."
          exit 1
        }
        BACKEND_DIR={{.BACKEND_DIR}} node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const envPath = path.join(process.env.BACKEND_DIR, ".env");
          const content = fs.readFileSync(envPath, "utf8");
          const match = content.match(/^[ \t]*(?:export[ \t]+)?DATABASE_URL[ \t]*=[ \t]*(.+?)[ \t]*$/m);
          const value = process.env.DATABASE_URL || match?.[1]?.replace(/^(['"])(.*)\1$/, "$2");
          if (!value) {
            console.error(`Error: DATABASE_URL no está definida en ${envPath} ni en el entorno.`);
            process.exit(1);
          }
          try {
            const url = new URL(value);
            if (!["postgres:", "postgresql:"].includes(url.protocol)) throw new Error();
          } catch {
            console.error("Error: DATABASE_URL debe ser una URL válida de PostgreSQL.");
            process.exit(1);
          }
          console.log("Configuración PostgreSQL del backend encontrada.");
        NODE
      - |
        if [ ! -f .env ]; then
          echo "Aviso: no existe .env en la raíz. Cópialo desde .env.example si vas a usar la API IA o Docker."
        else
          echo "Archivo .env de la raíz encontrado."
        fi

  setup:
    desc: Instala dependencias, genera Prisma Client y aplica migraciones
    cmds:
      - |
        if [ ! -f {{.BACKEND_DIR}}/.env ]; then
          cp {{.BACKEND_DIR}}/.env.example {{.BACKEND_DIR}}/.env
          echo "Creado {{.BACKEND_DIR}}/.env desde .env.example — revisa DATABASE_URL (usa localhost fuera de Docker)."
        fi
        if [ ! -f .env ]; then
          cp .env.example .env
          echo "Creado .env desde .env.example — revisa DEEPSEEK_API_KEY y JWT_SECRET."
        fi
      - task: env:check
      - task: install
      - task: db:generate
      - task: db:deploy
      - echo "Proyecto configurado correctamente."

  install:
    internal: true
    deps:
      - install:frontend
      - install:backend
      - install:ai

  install:frontend:
    internal: true
    cmds:
      - npm --prefix {{.FRONTEND_DIR}} ci

  install:backend:
    internal: true
    cmds:
      - npm --prefix {{.BACKEND_DIR}} ci

  install:ai:
    internal: true
    cmds:
      - bash scripts/setup.sh api

  db:generate:
    desc: Genera Prisma Client
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - npm run db:generate

  db:migrate:
    desc: Crea y aplica una migración de desarrollo (NAME=nombre)
    dir: '{{.BACKEND_DIR}}'
    requires:
      vars: [NAME]
    cmds:
      - npm run db:migrate -- --name "{{.NAME}}"

  db:deploy:
    desc: Aplica las migraciones pendientes
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - npm run db:deploy

  db:status:
    desc: Muestra el estado de las migraciones
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - npm run db:status
