version: '3'

vars:
  API_PORT: '{{default "3000" .PORT}}'
  WEB_PORT: '{{default "5173" .VITE_PORT}}'

tasks:
  default:
    desc: Lista las tareas disponibles
    cmds:
      - task --list

  dev:
    desc: Inicia frontend y backend en modo desarrollo
    cmds:
      - task: doctor
      - task: dev:services

  dev:services:
    internal: true
    deps:
      - dev:frontend
      - dev:backend

  dev:frontend:
    internal: true
    cmds:
      - npm --prefix frontend run dev -- --host 0.0.0.0 --port {{.WEB_PORT}} --strictPort

  dev:backend:
    internal: true
    env:
      PORT: '{{.API_PORT}}'
    cmds:
      - npm --prefix backend run start:dev

  doctor:
    desc: Comprueba herramientas, entorno, dependencias y puertos
    cmds:
      - |
        command -v node >/dev/null 2>&1 || {
          echo "Error: Node.js no está instalado o no está en PATH."
          exit 1
        }
        command -v npm >/dev/null 2>&1 || {
          echo "Error: npm no está instalado o no está en PATH."
          exit 1
        }
        node -e '
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 20 || (major === 20 && minor < 19)) {
            console.error("Error: se requiere Node.js 20.19 o superior.");
            process.exit(1);
          }
          console.log(`Node.js ${process.versions.node} y npm disponibles.`);
        '
      - task: env:check
      - |
        npm --prefix frontend ls --depth=0 >/dev/null 2>&1 || {
          echo "Error: faltan dependencias del frontend. Ejecuta: task setup"
          exit 1
        }
        npm --prefix backend ls --depth=0 >/dev/null 2>&1 || {
          echo "Error: faltan dependencias del backend. Ejecuta: task setup"
          exit 1
        }
        echo "Dependencias de frontend y backend instaladas."
      - |
        API_PORT={{.API_PORT}} WEB_PORT={{.WEB_PORT}} node -e '
          const net = require("node:net");
          const ports = [Number(process.env.API_PORT), Number(process.env.WEB_PORT)];
          const check = (port) => new Promise((resolve, reject) => {
            const server = net.createServer();
            server.unref();
            server.once("error", () => reject(new Error(`el puerto ${port} está ocupado`)));
            server.listen(port, "0.0.0.0", () => server.close(resolve));
          });
          Promise.all(ports.map(check))
            .then(() => console.log(`Puertos ${ports.join(" y ")} disponibles.`))
            .catch((error) => {
              console.error(`Error: ${error.message}.`);
              process.exit(1);
            });
        '
      - echo "Diagnóstico completado correctamente."

  env:check:
    internal: true
    cmds:
      - |
        test -f backend/.env || {
          echo "Error: no existe backend/.env. Cópialo desde backend/.env.example y configura DATABASE_URL."
          exit 1
        }
        node <<'NODE'
          const fs = require("node:fs");
          const content = fs.readFileSync("backend/.env", "utf8");
          const match = content.match(/^[ \t]*(?:export[ \t]+)?DATABASE_URL[ \t]*=[ \t]*(.+?)[ \t]*$/m);
          const value = process.env.DATABASE_URL || match?.[1]?.replace(/^(['"])(.*)\1$/, "$2");
          if (!value) {
            console.error("Error: DATABASE_URL no está definida en backend/.env ni en el entorno.");
            process.exit(1);
          }
          try {
            const url = new URL(value);
            if (!["postgres:", "postgresql:"].includes(url.protocol)) throw new Error();
          } catch {
            console.error("Error: DATABASE_URL debe ser una URL válida de PostgreSQL.");
            process.exit(1);
          }
          console.log("Configuración PostgreSQL encontrada.");
        NODE

  setup:
    desc: Instala dependencias, genera Prisma Client y aplica migraciones
    cmds:
      - task: env:check
      - task: install
      - task: db:generate
      - task: db:deploy
      - echo "Proyecto configurado correctamente."

  install:
    internal: true
    deps:
      - install:frontend
      - install:backend

  install:frontend:
    internal: true
    cmds:
      - npm --prefix frontend ci

  install:backend:
    internal: true
    cmds:
      - npm --prefix backend ci

  db:generate:
    desc: Genera Prisma Client
    dir: backend
    cmds:
      - npm run db:generate

  db:migrate:
    desc: Crea y aplica una migración de desarrollo (NAME=nombre)
    dir: backend
    requires:
      vars: [NAME]
    cmds:
      - npm run db:migrate -- --name "{{.NAME}}"

  db:deploy:
    desc: Aplica las migraciones pendientes
    dir: backend
    cmds:
      - npm run db:deploy

  db:status:
    desc: Muestra el estado de las migraciones
    dir: backend
    cmds:
      - npm run db:status
