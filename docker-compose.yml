# Tequendama — stack de fusión (arquitectura polyglot).
#   frontend(nginx) -> /api/v1 -> backend(NestJS)   -> postgres
#                   -> /api    -> seguria-ai(Python) -> postgres + redis
# Servicios opcionales (voz, agente Hermes, baileys) bajo perfiles.
services:
  postgres:
    # pgvector/pgvector (no postgres:16-alpine liso): el schema `docket` del
    # motor de versionado/QA de prompts necesita la extensión `vector`
    # (docket.call_turns.embedding). Supabase la trae disponible de fábrica —
    # este swap solo hace que el Postgres local de desarrollo se comporte
    # igual; no hace falta ningún cambio equivalente en el Supabase real.
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=seguria
      - POSTGRES_PASSWORD=seguria
      - POSTGRES_DB=seguria
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seguria"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Dominio: CRM de seguros (NestJS + Prisma) ----------
  backend:
    build: ./apps/backend
    image: seguria/backend:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://seguria:seguria@postgres:5432/seguria?schema=public
      # Sin pooler (Postgres propio del compose): DIRECT_URL = DATABASE_URL.
      # prisma.config.ts lo exige para `migrate deploy` en el entrypoint.
      - DIRECT_URL=postgresql://seguria:seguria@postgres:5432/seguria?schema=public
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-demo-secret-seguria-2026}
      - JWT_ACCESS_MINUTES=${JWT_ACCESS_MINUTES:-480}
      - JWT_REFRESH_DAYS=${JWT_REFRESH_DAYS:-7}
      # Secreto del webhook de Polar (Standard Webhooks): firma del webhook de pagos
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-}
      # Polar SANDBOX — Nest es el único dueño del access token / create checkout
      - POLAR_BASE_URL=${POLAR_BASE_URL:-https://sandbox-api.polar.sh/v1}
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-}
      - POLAR_SUCCESS_URL=${POLAR_SUCCESS_URL:-}
      # ELEVENLABS_WEBHOOK_SECRET: header simple de POST /elevenlabs/init (inicio de llamada).
      - ELEVENLABS_WEBHOOK_SECRET=${ELEVENLABS_WEBHOOK_SECRET:-demo-elevenlabs-secret-2026}
      # ELEVENLABS_POSTCALL_SECRET: firma HMAC de POST /elevenlabs/webhook (post-call).
      - ELEVENLABS_POSTCALL_SECRET=${ELEVENLABS_POSTCALL_SECRET:-demo-elevenlabs-postcall-secret-2026}
      # Perfilamiento post-llamada: el backend llama de vuelta al servicio IA
      # (primera llamada NestJS->Python del sistema; hasta ahora todo iba al revés).
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://seguria-ai:8085}
      - SERVICE_API_KEY=${SERVICE_API_KEY:-demo-service-2026}
      # Documentos adjuntos a clientes (binarios en disco; metadata en BD).
      - CUSTOMER_UPLOADS_DIR=${CUSTOMER_UPLOADS_DIR:-/app/uploads/customers}
    ports:
      - "3001:3000"   # 3000 del host lo ocupa metabase-local de otro proyecto
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped

  # ---------- Cerebro IA: chat SSE, cotizador, memoria, PDF (Python) ----------
  seguria-ai:
    build: ./apps/ai
    image: seguria/ai:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://seguria:seguria@postgres:5432/seguria
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:3000
      - JWT_SECRET=${JWT_SECRET:-demo-secret-seguria-2026}
      - MANAGER_API_KEY=${MANAGER_API_KEY:-demo-gerente-2026}
      - SERVICE_API_KEY=${SERVICE_API_KEY:-demo-service-2026}
      - MANAGER_PHONES=${MANAGER_PHONES:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      # Pagos: Nest es dueño de Polar; AI solo usa BACKEND_URL + X-Tenant-Id
      # Informes por correo (patrón Paloma: SMTP primario, Resend fallback)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      # Motor de llamadas salientes (ElevenLabs). Sin API key corre en modo demo.
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID:-}
      - ELEVENLABS_AGENT_PHONE_NUMBER_ID=${ELEVENLABS_AGENT_PHONE_NUMBER_ID:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      # Voz con Deepgram — la MISMA key alimenta dos cosas de este servicio:
      # la llamada en vivo del navegador (/ws/voice/live, junto con
      # DEEPSEEK_API_KEY: sin ambas responde "Voice Agent no configurado") y
      # las tools STT/TTS de notas de voz (app/voice_deepgram.py, demo sin key).
      # Definila UNA sola vez: compose aplica "la última gana" y un duplicado
      # más abajo pisaría esta línea en silencio.
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_STT_MODEL=${DEEPGRAM_STT_MODEL:-nova-3}
      - DEEPGRAM_STT_LANGUAGE=${DEEPGRAM_STT_LANGUAGE:-es}
      - DEEPGRAM_VOICE_MODEL=${DEEPGRAM_VOICE_MODEL:-aura-2-celeste-es}
      # think.endpoint del Voice Agent (URL del LLM compatible-OpenAI). Sin
      # esta línea el contenedor ignoraba un DEEPSEEK_BASE_URL custom del .env.
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Canal WhatsApp (gateway Baileys multi-tenant reusado). Vacío = demo.
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-}
      - WA_GATEWAY_WEBHOOK_SECRET=${WA_GATEWAY_WEBHOOK_SECRET:-}
      - WA_GATEWAY_TENANT=${WA_GATEWAY_TENANT:-tequendama}
      - WHATSAPP_BUSINESS_NUMBER=${WHATSAPP_BUSINESS_NUMBER:-}
      # URL pública de este servicio (links de firma/KYC/documentos). Vacío =
      # rutas relativas, no abren bien fuera de la SPA (ver esign.py/kyc.py).
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # URL pública del FRONTEND: links de activación del checklist
      # (${FRONTEND_PUBLIC_URL}/activacion/<token>, ver checklist.py). Sin
      # esta línea, el valor del .env jamás llegaba al contenedor.
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-}
      - ESIGN_LINK_TTL_MINUTES=${ESIGN_LINK_TTL_MINUTES:-60}
      # KYC (Didit). Sin DIDIT_API_KEY corre en modo demo (ver kyc.py).
      - DIDIT_API_KEY=${DIDIT_API_KEY:-}
      - DIDIT_BASE_URL=${DIDIT_BASE_URL:-https://verification.didit.me}
      - DIDIT_LIVENESS_MIN_SCORE=${DIDIT_LIVENESS_MIN_SCORE:-70}
      - DIDIT_FACE_MATCH_MIN_SCORE=${DIDIT_FACE_MATCH_MIN_SCORE:-70}
      - KYC_LINK_TTL_MINUTES=${KYC_LINK_TTL_MINUTES:-60}
      # Motor de versionado/QA de prompts (docket, ver app/docket_engine/). false = demo.
      - DOCKET_ENGINE_ENABLED=${DOCKET_ENGINE_ENABLED:-false}
      - SEGURIA_DATA_DIR=/data/market
      # Cierre autónomo: KYC_ENFORCE=true (default) NO emite sin los datos obligatorios
      # del producto. Identidad (Didit) y firma electrónica se validan aparte.
      - SEGURIA_KYC_ENFORCE=${SEGURIA_KYC_ENFORCE:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Seguro embebido (quote & bind para aliados) y TTS del chat web
      - PARTNER_API_KEYS=${PARTNER_API_KEYS:-demo-partner-2026}
      - TTS_URL=${TTS_URL:-http://seguria-tts:8880}
      - TTS_VOICE=${TTS_VOICE:-ef_dora}
    volumes:
      - ./apps/ai/data/market:/data/market:ro
      - seguria-state:/app/state
    ports:
      - "8085:8085"
    restart: unless-stopped

  # ---------- Frontend (Tequendama React servido por nginx + proxy APIs) ----------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../deploy/frontend.Dockerfile
    image: seguria/frontend:latest
    depends_on:
      - backend
      - seguria-ai
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"   # 8080 del host lo ocupa palomaos-evolution-api de otro proyecto
    restart: unless-stopped

  # ---------- Voz TTS (opcional) ----------
  seguria-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["voz"]
    ports:
      - "8880:8880"
    volumes:
      - kokoro-cache:/app/.cache
    restart: unless-stopped

  # ---------- Agente Hermes (opcional, consola/WhatsApp) ----------
  hermes-agent:
    build:
      context: .
      dockerfile: deploy/hermes.Dockerfile
    image: seguria/hermes:latest
    profiles: ["hermes"]
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - SEGURIA_API_URL=http://seguria-ai:8085
      - SEGURIA_TTS_URL=http://seguria-tts:8880
      - MANAGER_API_KEY=${MANAGER_API_KEY:-demo-gerente-2026}
      - SERVICE_API_KEY=${SERVICE_API_KEY:-demo-service-2026}
      - HERMES_MODE=${HERMES_MODE:-idle}
      # Gateway WhatsApp: habilita la plataforma; el emparejamiento QR se hace
      # con `docker compose exec hermes-agent hermes whatsapp` (persiste en volumen)
      - WHATSAPP_ENABLED=${WHATSAPP_ENABLED:-true}
      # Atiende a CUALQUIER remitente (demo hackathon): modo bot (no self-chat),
      # DMs abiertos y opt-in explícito que exige Hermes para política abierta.
      - WHATSAPP_MODE=${WHATSAPP_MODE:-bot}
      - WHATSAPP_DM_POLICY=${WHATSAPP_DM_POLICY:-open}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-true}
      # El bridge Node exige su propio allowlist; * = bot abierto a cualquiera
      - WHATSAPP_ALLOWED_USERS=${WHATSAPP_ALLOWED_USERS:-*}
    volumes:
      - ./apps/services/hermes-agent:/workspace:ro
      - hermes-sessions:/root/.hermes/sessions
      - hermes-platforms:/root/.hermes/platforms
      - hermes-memories:/root/.hermes/memories
    restart: unless-stopped

  baileys-bridge:
    build: ./apps/services/baileys-bridge
    image: seguria/baileys:latest
    profiles: ["baileys"]
    ports:
      - "8081:8080"
    environment:
      - API_KEY=${BAILEYS_API_KEY:-seguria-baileys}
    volumes:
      - baileys-instances:/data/instances
    restart: unless-stopped

  # Agente de voz saliente (Deepgram Voice Agent API + Twilio), adaptado del
  # reference implementation de Deepgram (deepgram-devs/deepgram-voice-agent-
  # outbound-telephony) para Tequendama Seguros: español colombiano, seguro
  # de vehículo, Verified Caller ID en vez de número comprado. Necesita
  # SERVER_EXTERNAL_URL apuntando a un túnel público (ngrok) para que Twilio
  # pueda abrir el WebSocket de audio de vuelta — no funciona sin eso.
  deepgram-outbound:
    build: ./apps/services/deepgram-outbound
    image: seguria/deepgram-outbound:latest
    profiles: ["voice-outbound"]
    ports:
      - "8082:8080"
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - SERVER_EXTERNAL_URL=${DEEPGRAM_SERVER_EXTERNAL_URL:-}
      - STT_MODEL=${DEEPGRAM_STT_MODEL:-nova-3}
      - STT_LANGUAGE=${DEEPGRAM_STT_LANGUAGE:-es}
      - LLM_MODEL=${DEEPGRAM_LLM_MODEL:-gpt-4o-mini}
      - LLM_PROVIDER=${DEEPGRAM_LLM_PROVIDER:-open_ai}
      - VOICE_MODEL=${DEEPGRAM_VOICE_MODEL:-aura-2-celeste-es}
      - TTS_PROVIDER=deepgram
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      # Verified Caller ID (+573203199867), NO un número comprado.
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - ENDPOINT_SECRET=${DEEPGRAM_ENDPOINT_SECRET:-}
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  backend-uploads:
  seguria-state:
  kokoro-cache:
  hermes-sessions:
  hermes-platforms:
  hermes-memories:
  baileys-instances:
