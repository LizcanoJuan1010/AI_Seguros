# nginx del frontend: sirve la SPA de Tequendama y enruta las APIs.
#  /api/v1/*  -> backend NestJS (dominio)
#  /api/*     -> servicio IA Python (chat SSE, cotizador, documentos, insights)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dominio (NestJS). Prefijo más específico: nginx lo prioriza sobre /api/.
    location /api/v1/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Servicio IA (Python). Incluye el chat por SSE.
    location /api/ {
        proxy_pass http://seguria-ai:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE: sin buffering, conexión larga
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
