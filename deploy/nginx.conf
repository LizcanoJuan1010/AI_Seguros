# nginx del frontend: sirve la SPA de Tequendama y enruta las APIs.
#  /api/v1/*  -> backend NestJS (dominio; incluye el gateway WS /api/v1/live-call)
#  /api/*     -> servicio IA Python (chat SSE, cotizador, documentos, insights)

# Connection: upgrade solo en el handshake WS (Upgrade presente); en requests
# HTTP normales de /api/v1/ (REST) manda 'close' para no romper keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subida de documentos al chat (el default de 1m rechaza con 413
    # cualquier PDF/foto real; el front limita a 10 MB por archivo)
    client_max_body_size 15m;

    # SPA: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dominio (NestJS). Prefijo más específico: nginx lo prioriza sobre /api/.
    # Incluye el gateway WS de la llamada en vivo (/api/v1/live-call) — sin
    # los headers Upgrade/Connection el handshake nunca llega a Nest.
    location /api/v1/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Servicio IA (Python). Incluye el chat por SSE.
    location /api/ {
        proxy_pass http://seguria-ai:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE: sin buffering, conexión larga
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
