# nginx del frontend: sirve la SPA de Tequendama y enruta las APIs.
#  /api/v1/*  -> backend NestJS (dominio; incluye el gateway WS /api/v1/live-call)
#  /api/*     -> servicio IA Python (chat SSE, cotizador, documentos, insights)

# DNS embebido de Docker Compose. Sin esto nginx resuelve `backend` y
# `seguria-ai` UNA sola vez al cargar la config y congela esa IP: al recrear
# el contenedor (`docker compose up -d --build backend`) la IP cambia y todo
# /api/v1/ devuelve 502 hasta reiniciar ESTE contenedor (nos pasó dos veces).
# 127.0.0.11 es el resolver que Docker pone en /etc/resolv.conf de toda red
# definida por el usuario (la de Compose lo es). Mismo patrón que
# nginx.railway.conf.template, donde el problema es idéntico. ipv6=off: el
# DNS de Compose no publica AAAA para servicios y cada lookup fallido suma
# latencia y ruido al log.
resolver 127.0.0.11 ipv6=off valid=10s;

# Connection: upgrade solo en el handshake WS (Upgrade presente); en requests
# HTTP normales de /api/v1/ (REST) manda 'close' para no romper keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subida de documentos al chat (el default de 1m rechaza con 413
    # cualquier PDF/foto real; el front limita a 10 MB por archivo)
    client_max_body_size 15m;

    # SPA: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dominio (NestJS). Prefijo más específico: nginx lo prioriza sobre /api/.
    # Incluye el gateway WS de la llamada en vivo (/api/v1/live-call) — sin
    # los headers Upgrade/Connection el handshake nunca llega a Nest.
    # Hostname en VARIABLE, no literal: obliga a re-resolverlo en cada request
    # con el `resolver` de arriba. Sin componente de URI en proxy_pass el
    # request URI pasa tal cual — NO agregarle "/" al final (cambiaría la
    # semántica a reemplazo de prefijo y rompería el ruteo).
    location /api/v1/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Servicio IA (Python). Incluye el chat por SSE.
    location /api/ {
        set $ai_upstream http://seguria-ai:8085;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE: sin buffering, conexión larga
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
